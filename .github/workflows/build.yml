name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed delta_weapon_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: delta-weapon-tool
          path: dist/delta_weapon_tool.exe
